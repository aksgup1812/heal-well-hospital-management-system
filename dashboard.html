<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heal Well Hospital | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <script src="./assets/js/theme.js"></script>
  <link href="./assets/css/dashboard.css?v=3" rel="stylesheet">
  <style>
    /* Inline fallback keeps the application usable if the local stylesheet is blocked or cached incorrectly. */
    :root{--primary:#1769aa;--ink:#17324d;--muted:#6b8196;--bg:#f5f9fd;--surface:#fff;--line:#dfeaf3;--sidebar:264px}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:var(--bg)}.sidebar{width:var(--sidebar);position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,#0a3762,#102b48);color:#d9e9f8;z-index:1050;display:flex;flex-direction:column}.sidebar-brand{padding:18px 20px;color:#fff;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12)}.sidebar-logo{width:44px;height:44px;object-fit:cover;border-radius:10px;background:#fff}.sidebar-brand>span{font-size:1.1rem;font-weight:700}.sidebar-nav{padding:15px 13px;overflow-y:auto}.sidebar .nav-link{color:#c8ddee;border-radius:10px;padding:11px 13px;margin:3px 0;display:flex;align-items:center;gap:13px;font-size:.92rem;text-decoration:none}.sidebar .nav-link:hover,.sidebar .nav-link.active{background:rgba(74,159,225,.2);color:#fff}.sidebar .nav-link.active{box-shadow:inset 3px 0 #72b8ed}.nav-label{font-size:.66rem;letter-spacing:.12em;color:#7fa5c6;margin:23px 12px 7px}.sidebar-footer{margin-top:auto;padding:18px 25px;font-size:.78rem;border-top:1px solid rgba(255,255,255,.12);color:#b4d0e8}.main-content{margin-left:var(--sidebar);min-height:100vh}.topbar{height:74px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar-title h6{margin:0;font-size:1.05rem}.topbar-title span,.stat-label,.section-subtitle,.view-header p,.activity-time{color:var(--muted)}.topbar-actions{display:flex;align-items:center;gap:11px}.icon-button{height:37px;width:37px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#526b83}.dropdown{position:relative}.notification-menu{display:none;position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(15,57,94,.15);padding:13px;z-index:1200}.notification-menu.show{display:block}.user-chip{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e0f0ff;color:var(--primary);font-weight:700}.content-area{padding:30px;max-width:1600px;margin:auto}.welcome-card{background:linear-gradient(105deg,#0f5e9d,#328bd1);color:#fff;padding:28px 32px;border-radius:18px;position:relative;overflow:hidden}.welcome-card h2{margin:.4rem 0;font-size:1.6rem}.stat-card,.panel-card{background:#fff;border:1px solid var(--line);border-radius:16px}.stat-card{padding:19px;display:flex;align-items:center;gap:14px}.stat-icon{width:47px;height:47px;display:grid;place-items:center;border-radius:13px;font-size:1.15rem}.stat-value{font-size:1.35rem;font-weight:700}.panel-card{padding:22px}.section-heading{font-size:1rem;font-weight:700;margin:0}.quick-action{width:100%;padding:13px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;color:var(--ink);font-size:.85rem}.quick-action i{color:var(--primary);width:22px}.view-header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}.view-header h2{font-size:1.45rem;font-weight:700;margin:0}.search-box{max-width:285px}.table-wrap{overflow-x:auto}.data-table{font-size:.84rem;margin:0;width:100%;border-collapse:collapse}.data-table th{font-size:.71rem;text-transform:uppercase;color:#5f7790;background:#f4f9fd;padding:13px;text-align:left}.data-table td{vertical-align:middle;padding:13px;border-top:1px solid var(--line)}.btn-action{border:0;background:transparent;color:#66809a;padding:5px}.badge-status{font-weight:600;border-radius:20px;padding:5px 9px;font-size:.68rem}.chart-wrap{height:290px;position:relative}.hms-modal{display:none;position:fixed;inset:0;background:rgba(10,35,58,.55);z-index:2000;padding:20px;overflow:auto}.hms-modal.hms-modal-open{display:flex;align-items:center;justify-content:center}.hms-modal .modal-dialog{width:min(700px,100%);margin:auto}.hms-modal .modal-content{background:#fff;border-radius:14px;box-shadow:0 18px 45px rgba(10,35,58,.28);overflow:hidden}.hms-modal .modal-header,.hms-modal .modal-footer{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.hms-modal .modal-footer{border-bottom:0;border-top:1px solid var(--line);justify-content:flex-end;gap:10px}.hms-modal .modal-body{padding:20px}.hms-modal .btn-close{border:0;background:transparent;font-size:1.4rem;line-height:1;cursor:pointer}.toast{background:#1769aa;color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:10px;box-shadow:0 8px 20px rgba(10,35,58,.2)}@media(max-width:991px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0}.content-area{padding:22px 17px}}@media(max-width:575px){.topbar-title{display:none}.content-area{padding:18px 14px}.view-header{align-items:stretch;flex-direction:column}.search-box{max-width:none}}
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><img class="sidebar-logo" src="./assets/images/heal-well-logo.png" alt="Heal Well Hospital logo"><div class="sidebar-brand-copy"><span>Heal Well</span><small>ADMIN CONSOLE</small></div><button class="btn-close-sidebar d-lg-none" type="button" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button></div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-link active" data-view="dashboard"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
        <p class="nav-label">MANAGEMENT</p>
        <a href="#patients" class="nav-link" data-view="patients"><i class="fa-solid fa-bed-pulse"></i> Patients</a>
        <a href="#doctors" class="nav-link" data-view="doctors"><i class="fa-solid fa-user-doctor"></i> Doctors</a>
        <a href="#appointments" class="nav-link" data-view="appointments"><i class="fa-regular fa-calendar-check"></i> Appointments</a>
        <a href="#emergency" class="nav-link" data-view="emergency"><i class="fa-solid fa-truck-medical"></i> Emergency</a>
        <p class="nav-label">SERVICES</p>
        <a href="#laboratory" class="nav-link" data-view="laboratory"><i class="fa-solid fa-flask-vial"></i> Laboratory</a>
        <a href="#pharmacy" class="nav-link" data-view="pharmacy"><i class="fa-solid fa-pills"></i> Pharmacy</a>
        <a href="#billing" class="nav-link" data-view="billing"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a>
        <a href="#reports" class="nav-link" data-view="reports"><i class="fa-solid fa-chart-pie"></i> Reports</a>
      </nav>
      <div class="sidebar-footer"><span class="status-pulse"><i class="fa-solid fa-circle-check"></i></span><div><strong>System online</strong><small>All services operational</small></div></div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <main class="main-content">
      <header class="topbar">
        <button id="menuToggle" class="btn btn-light border d-lg-none" type="button" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title"><span class="topbar-eyebrow">ADMIN CONSOLE</span><h6 id="pageTitle">Dashboard</h6><span id="liveDate" class="topbar-date"></span><span id="liveSyncStatus" class="topbar-sync-status" data-state="pending"><i class="fa-solid fa-circle"></i> Starting live sync</span></div>
        <div class="topbar-actions"><a class="topbar-home d-none d-md-inline-flex" href="index.html"><i class="fa-solid fa-arrow-up-right-from-square"></i> View website</a><button id="darkToggle" class="icon-button theme-toggle" data-theme-toggle type="button"><i data-theme-icon class="fa-regular fa-moon"></i><span data-theme-label class="theme-toggle-text">Dark mode</span></button><div class="dropdown"><button id="notificationToggle" class="icon-button position-relative" type="button" aria-label="Notifications" aria-expanded="false"><i class="fa-regular fa-bell"></i><span id="notificationBadge" class="notification-dot"></span></button><div id="notificationMenu" class="dropdown-menu dropdown-menu-end notification-menu"><h6>Notifications</h6><div id="notificationList"></div></div></div><div class="user-chip"><span class="avatar">A</span><span id="currentUser" class="d-none d-sm-inline">Administrator</span></div><button id="logoutBtn" class="btn btn-sm btn-outline-danger logout-button"><i class="fa-solid fa-arrow-right-from-bracket"></i><span class="d-none d-sm-inline ms-1">Logout</span></button></div>
      </header>
      <section id="viewContent" class="content-area"></section>
    </main>
  </div>

  <div class="modal hms-modal" id="recordModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><form id="recordForm"><div class="modal-header"><h5 id="recordModalTitle" class="modal-title">Add Record</h5><button type="button" class="btn-close" data-modal-close="recordModal" aria-label="Close">&times;</button></div><div id="recordModalBody" class="modal-body"></div><div class="modal-footer"><button type="button" class="btn btn-light border" data-modal-close="recordModal">Cancel</button><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i> Save Record</button></div></form></div></div></div>
  <div class="modal hms-modal" id="invoiceModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header no-print"><h5 class="modal-title">Patient Invoice</h5><button type="button" class="btn-close" data-modal-close="invoiceModal" aria-label="Close">&times;</button></div><div id="invoiceContent" class="modal-body p-4"></div><div class="modal-footer no-print"><button class="btn btn-primary" id="printInvoice"><i class="fa-solid fa-print me-1"></i> Print Invoice</button></div></div></div></div>
  <div id="toastArea" class="toast-container position-fixed top-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
