<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heal Well Hospital | Patient Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<body class="login-page">
  <button class="theme-toggle theme-toggle-floating" data-theme-toggle type="button"><i data-theme-icon class="fa-regular fa-moon"></i><span data-theme-label>Dark mode</span></button>
  <main class="login-shell container"><section class="row g-0 login-card shadow-lg"><div class="col-lg-6 brand-panel d-none d-lg-flex"><div><a class="back-home" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to public website</a><div class="hospital-mark mb-4 p-0 overflow-hidden"><img src="./assets/images/heal-well-logo.png" class="w-100 h-100 object-fit-cover" alt="Heal Well Hospital logo"></div><p class="text-uppercase fw-semibold letter-space mb-2">PATIENT PORTAL</p><h1>Create your<br>Heal Well account</h1><p class="lead mt-4">Book appointments and follow your requests from one private portal.</p></div></div><div class="col-lg-6 form-panel"><div class="form-wrap"><a class="back-home d-lg-none" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to public website</a><div class="mb-4"><span class="eyebrow">PATIENT REGISTRATION</span><h2 class="mt-2">Create an account</h2><p class="text-muted mb-0">Your phone number becomes your patient login.</p></div><form id="registerForm" novalidate><div class="mb-3"><label class="form-label" for="registerName">Full name</label><input id="registerName" class="form-control border" type="text" required placeholder="Enter your full name"></div><div class="mb-3"><label class="form-label" for="registerPhone">Phone number</label><input id="registerPhone" class="form-control border" type="tel" required pattern="[0-9+ -]{7,}" placeholder="Enter your phone number"></div><div class="mb-2"><label class="form-label" for="registerPassword">Create password</label><input id="registerPassword" class="form-control border" type="password" required minlength="6" placeholder="At least 6 characters"></div><div id="registerAlert" class="alert alert-danger d-none mt-3 mb-0" role="alert"></div><button class="btn btn-primary w-100 mt-4 py-2 fw-semibold" type="submit">Create patient account <i class="fa-solid fa-arrow-right ms-2"></i></button></form><p class="text-center text-muted small mt-4 mb-0">Already have an account? <a href="login.html">Sign in</a></p></div></div></section></main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/patient-register.js"></script>
</body>
